name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.302"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify standard MCP install contract
        run: npm run phase:1.6

      - name: Verify official MCP SDK client
        run: npm run phase:1.7

      - name: Verify official MCP SDK server transport
        run: npm run phase:1.8

      - name: Verify Windows SEA packaging
        run: npm run artifact:windows:build -- --allow-network
