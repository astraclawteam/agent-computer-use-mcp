name: Real application compatibility
description: Report a safe, reproducible desktop workflow that Computer Use cannot yet complete reliably.
title: "[App]: "
labels: ["app-smoke"]
body:
  - type: input
    id: app
    attributes:
      label: Application
      description: Include the application version and Windows version.
      placeholder: "Example: Notepad 11.x on Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: Minimum flow
      description: Describe the smallest natural-language task and the externally visible final state.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Expected capability source
      options:
        - uia-som
        - ocr
        - template
        - cv
        - browser-semantic
        - manual-only
        - insufficient
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety notes
      description: Use synthetic data. Include private-data, password, payment, send/submit, or destructive-action risks.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Structured evidence
      description: Paste redacted tool names, error codes, focus/scale/truncation metadata, execution paths, or fallback reasons. Do not paste screenshots or local paths.
    validations:
      required: true
