name: Capability or release proposal
description: Propose a bounded capability, interoperability improvement, or release-safety change.
title: "[Proposal]: "
labels: ["productization"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Which real user outcome or maintenance risk does this improve?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Package foundation
        - Permission and policy
        - Stable runtime
        - Perception hardening
        - Commercial overlay
        - MCP compatibility
        - Real software matrix
        - Install experience
        - Documentation and adoption
        - Release automation
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable behavior, exact commands, and evidence required to close this.
      placeholder: |
        - npm test passes
        - phase script returns status=passed
        - docs/productization/app-smoke-matrix.md updated
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and constraints
      description: Note platform, dependency, model size, offline, privacy, security, compatibility, or UX risks.
    validations:
      required: true
